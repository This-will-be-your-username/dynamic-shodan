{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dynamic-shodan</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="28" height="28"><b>dynamic<span>-shodan</span></b></a>
  <nav>
    <a href="/" {{if eq .Active "dashboard"}}class="active"{{end}}>Dashboard</a>
    <a href="/history" {{if eq .Active "history"}}class="active"{{end}}>IP history</a>
    <a href="/config" {{if eq .Active "config"}}class="active"{{end}}>Configuration</a>
  </nav>
</header>
<main>
{{with .Flash}}<div class="flash ok">{{.}}</div>{{end}}
{{with .FlashErr}}<div class="flash err">{{.}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
